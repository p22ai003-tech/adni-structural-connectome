name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The imaging toolchain (MRtrix3, FSL, ANTs) is not installed here, and
      # does not need to be: everything under testpaths runs on synthetic
      # inputs. The tests that need real binaries are the run itself, which is
      # hours of compute and belongs on a machine with the data.
      - name: Tests
        run: pytest -q

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      # The locked source manifest pins a SHA-256 for every file the workflow
      # contract covers. If a rule changed without the lock being regenerated,
      # this says so here rather than three hours into someone's run.
      - name: Workflow source lock is current
        run: python scforge/workflow/lock_source_manifest.py --check

      - name: Configuration parses and the schema is valid
        run: |
          python - <<'PY'
          import json, pathlib, yaml
          from jsonschema import Draft202012Validator
          for path in pathlib.Path("configs").glob("*.yaml"):
              yaml.safe_load(path.read_text())
              print(f"ok  {path}")
          for path in pathlib.Path("scforge/workflow/schemas").glob("*.json"):
              Draft202012Validator.check_schema(json.loads(path.read_text()))
              print(f"ok  {path}")
          PY

  ships-no-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repository ships code, configuration and the atlas. Imaging data,
      # participant tables and credentials belong to the site that holds them,
      # and a commit that adds one should fail here rather than be noticed
      # later.
      - name: No imaging data, credentials or private keys
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          tracked = subprocess.run(["git", "ls-files"], capture_output=True,
                                   text=True, check=True).stdout.split()
          imaging = {".dcm", ".ima", ".nii", ".mif", ".tck", ".trk", ".bval", ".bvec"}
          problems = []
          for name in tracked:
              path = pathlib.Path(name)
              suffixes = {s.lower() for s in path.suffixes}
              if suffixes & imaging and not str(path).startswith("atlas/"):
                  problems.append(f"imaging file: {name}")
              if path.name in {".env", "id_rsa", "id_ed25519", ".netrc", "credentials"}:
                  problems.append(f"credential file: {name}")
          if problems:
              print("\n".join(problems))
              sys.exit(1)
          print(f"{len(tracked)} tracked files, none of them data or credentials")
          PY
