[pytest]
# Where the tests are. Without this, pytest walks the whole tree, including the
# data/ symlink to the imaging volume, and appears to hang.
testpaths = tests scforge/tests research_audit/tests
norecursedirs = data dist archive node_modules .git .venv* .envs tools
# scforge/ holds the package at scforge/scforge; putting scforge/ on the path is
# what makes `import scforge.provenance` resolve. Previously that only worked
# when some other test module happened to insert the path first.
pythonpath = scforge .
