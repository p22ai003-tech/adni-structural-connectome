[pytest]
# Where the tests are. Without this, pytest walks the whole tree, including the
# data/ symlink to the imaging volume, and appears to hang.
#
# research_audit/tests is deliberately NOT here. Those tests check frozen
# decision records against the live configuration -- they assert, for instance,
# that the H04A approval still names the current SHA-256 of
# configs/connectome_v2.yaml. That is the right check while a cohort is being
# audited and the config is frozen, and the wrong one for a pipeline other
# people configure for their own data. The records are attestations and are not
# edited to match a config that has moved on; run them explicitly with
#     pytest research_audit/tests
# when auditing a frozen recipe. research_audit/ is not part of the package.
testpaths = tests scforge/tests
norecursedirs = data dist archive node_modules .git .venv* .envs tools research_audit
# scforge/ holds the package at scforge/scforge; putting scforge/ on the path is
# what makes `import scforge.provenance` resolve. Previously that only worked
# when some other test module happened to insert the path first.
pythonpath = scforge .
