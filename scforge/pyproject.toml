[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scforge"
version = "0.1.0"
description = "Contract-first structural connectome compiler for the exp project."
requires-python = ">=3.10"
dependencies = [
  "jsonschema",
  "numpy",
  "pandas",
  "pyyaml",
]

[project.scripts]
scforge = "scforge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scforge*"]
